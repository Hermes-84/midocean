name: Toppoint clean export QA

on:
  pull_request:
    paths:
      - 'toppoint/**'
      - '.github/workflows/toppoint-clean-pr-test.yml'
      - '.github/workflows/toppoint-sync.yml'

permissions:
  contents: read

concurrency:
  group: toppoint-clean-export-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: toppoint/requirements.txt
      - run: pip install -r toppoint/requirements.txt
      - name: Build and validate against live Toppoint V4/V3 feeds
        env:
          TOPPOINT_AWS_ACCESS_KEY_ID: ${{ secrets.TOPPOINT_AWS_ACCESS_KEY_ID }}
          TOPPOINT_AWS_SECRET_ACCESS_KEY: ${{ secrets.TOPPOINT_AWS_SECRET_ACCESS_KEY }}
        run: python toppoint/test_clean_exports.py
      - name: Upload QA report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toppoint-clean-qa
          path: out/toppoint-clean-qa
          if-no-files-found: error
          retention-days: 3
